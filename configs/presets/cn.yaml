# Blackout Kit Regional Preset: China (CN)
# Strategy: GFW evasion using Hysteria2 / TUIC transport, quad9 DoH, and UDP obfuscation.

region: CN
name: China GFW Bypass Profile
version: 1.0

dns:
  mode: doh
  primary: "https://dns.quad9.net/dns-query"
  fallback: "https://223.5.5.5/dns-query"
  bypass_domains:
    - "*.cn"
    - "*.baidu.com"
    - "*.taobao.com"

transport:
  type: hysteria2
  obfs: salamander
  obfs_password: "blackout-default-pass"
  congestion_control: bbr

routing:
  bypass_local: true
