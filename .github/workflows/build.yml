name: Build & Release Executable

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  package-smoke:
    name: Package and CLI contract smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build wheel and sdist
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel --sdist --outdir dist

    - name: Install core wheel in clean environment
      run: |
        python -m venv /tmp/blackout-core
        /tmp/blackout-core/bin/python -m pip install dist/*.whl
        /tmp/blackout-core/bin/blackout --json version > /tmp/blackout-version.json
        /tmp/blackout-core/bin/python - <<'PY'
        import json
        from pathlib import Path
        payload = json.loads(Path('/tmp/blackout-version.json').read_text())
        assert payload['ok'] is True
        assert payload['schema_version'] == 1
        assert '\\x1b' not in Path('/tmp/blackout-version.json').read_text()
        import blackoutkit
        for relative in ('data/cloudflare_ips.txt', 'data/fake_snis.txt', 'data/gas_ids.txt', 'assets/world_map.jpg'):
            assert blackoutkit.resource_path(relative).is_file(), relative
        PY

    - name: Install and smoke test sdist in clean environment
      run: |
        python -m venv /tmp/blackout-sdist
        sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
        HOME=/tmp/blackout-sdist-home /tmp/blackout-sdist/bin/python -m pip install "${sdist}"
        HOME=/tmp/blackout-sdist-home /tmp/blackout-sdist/bin/blackout --help
        HOME=/tmp/blackout-sdist-home /tmp/blackout-sdist/bin/blackout --json version > /tmp/blackout-sdist-version.json
        /tmp/blackout-sdist/bin/python - <<'PY'
        import json
        from pathlib import Path
        output = Path('/tmp/blackout-sdist-version.json').read_text()
        payload = json.loads(output)
        assert payload['ok'] is True
        assert '\\x1b' not in output
        import blackoutkit
        for relative in ('data/cloudflare_ips.txt', 'data/fake_snis.txt', 'data/gas_ids.txt', 'assets/world_map.jpg'):
            assert blackoutkit.resource_path(relative).is_file(), relative
        PY

    - name: Install all-feature wheel in clean environment
      run: |
        python -m venv /tmp/blackout-all
        wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
        /tmp/blackout-all/bin/python -m pip install "${wheel}[all]"
        /tmp/blackout-all/bin/blackout --help
        /tmp/blackout-all/bin/blackout --show-completion bash > /tmp/blackout-completion.sh
        test -s /tmp/blackout-completion.sh

    - name: Verify unsupported JSON is rejected before dispatch
      run: |
        set +e
        /tmp/blackout-core/bin/blackout --json tools ping 127.0.0.1 > /tmp/blackout-error.json
        status=$?
        set -e
        test "$status" -eq 2
        /tmp/blackout-core/bin/python - <<'PY'
        import json
        from pathlib import Path
        payload = json.loads(Path('/tmp/blackout-error.json').read_text())
        assert payload['ok'] is False
        assert payload['error']['code'] == 'unsupported_output_mode'
        PY

    - name: Run startup benchmark
      run: |
        /tmp/blackout-core/bin/python scripts/benchmark_startup.py --installed --json --runs 5 > startup-benchmark.json

    - name: Upload package and benchmark artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blackout-package-smoke
        path: |
          dist/*
          startup-benchmark.json

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Go 1.26
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: |
          engine/warp/go.sum
          engine/v2/go.sum

    - name: Verify WARP dependency graph
      shell: pwsh
      run: |
        go -C engine/warp mod verify
        go -C engine/warp test ./...
        $warpDll = Join-Path $env:RUNNER_TEMP "blackout_warp.dll"
        go -C engine/warp build -buildmode=c-shared -o $warpDll .
        if (-not (Test-Path $warpDll)) { throw "WARP DLL build output is missing" }

    # engine/v2 is the supervised daemon that replaces the in-process
    # blackout_core.dll. It is verified and built here on every push so the
    # control channel, framing codec and daemon entrypoint cannot rot
    # unnoticed — v1's engine/ had no CI coverage at all.
    - name: Verify and build engine/v2 core
      shell: pwsh
      working-directory: engine/v2
      run: |
        # pwsh keeps running after a failing native command unless told not to,
        # so a red `go test` would otherwise be hidden by the build that follows.
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        go mod verify
        go vet ./...
        go test ./...
        $core = Join-Path $env:RUNNER_TEMP "blackout-core.exe"
        go build -o $core ./cmd/blackout-core
        if (-not (Test-Path $core)) { throw "engine/v2 core build output is missing" }
        & $core -version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pytest

    - name: Run Python tests
      shell: pwsh
      timeout-minutes: 30
      env:
        # Same text-encoding defaults as the Linux runner. Without them a piped
        # child process falls back to the ANSI code page (cp1252).
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        # Private temp root for this run, so tempfile and tmp_path output never
        # shares the runner's temp directory.
        $temp = Join-Path $env:RUNNER_TEMP "pytest-temp"
        New-Item -ItemType Directory -Force $temp | Out-Null
        $env:TEMP = $temp
        $env:TMP = $temp
        $env:TMPDIR = $temp
        python -m pytest --rootdir=. tests -p no:cacheprovider `
          "--basetemp=$(Join-Path $temp 'basetemp')" `
          "--junitxml=$(Join-Path $env:RUNNER_TEMP 'pytest-junit.xml')"

    - name: Annotate failing Python tests
      if: failure()
      shell: pwsh
      run: python scripts/annotate_pytest_junit.py "$(Join-Path $env:RUNNER_TEMP 'pytest-junit.xml')"

    - name: Verify wheel installation
      shell: pwsh
      run: |
        $repo = (Get-Location).Path
        $smokeDir = Join-Path $env:RUNNER_TEMP "blackout-wheel-smoke"
        New-Item -ItemType Directory -Force $smokeDir | Out-Null
        python -m pip wheel --no-deps --wheel-dir $smokeDir $repo
        python -m venv (Join-Path $smokeDir "venv")
        $wheel = (Get-ChildItem $smokeDir -Filter *.whl | Select-Object -First 1).FullName
        & (Join-Path $smokeDir "venv\Scripts\python.exe") -m pip install $wheel
        Push-Location $smokeDir
        & (Join-Path $smokeDir "venv\Scripts\blackout.exe") version
        Pop-Location

    - name: Build Executable with PyInstaller
      run: pyinstaller --clean blackout.spec

    - name: Smoke test executable
      run: .\dist\blackout.exe version

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: blackout-windows-exe
        path: dist/blackout.exe

  build-linux:
    name: Build Linux Runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Go 1.26
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: |
          engine/go.sum
          engine/v2/go.sum

    - name: Build Linux runtime
      run: |
        mkdir -p dist
        go -C engine build -o ../dist/blackout-engine-linux-amd64 .
        test -x dist/blackout-engine-linux-amd64
        file dist/blackout-engine-linux-amd64 | grep -q ELF

    # Also exercised on Linux so the Unix-domain-socket transport is covered;
    # the Windows job only ever hits the named-pipe path.
    # working-directory keeps the -o output and the dist/ checks in one
    # directory. `go -C engine/v2 build -o dist/...` wrote to engine/v2/dist/
    # while `test -x dist/...` looked in the repository-root dist/, which failed
    # the job right after the build.
    - name: Verify and build engine/v2 core
      working-directory: engine/v2
      run: |
        go mod verify
        go vet ./...
        go test ./...
        go build -o dist/blackout-core-linux-amd64 ./cmd/blackout-core
        test -x dist/blackout-core-linux-amd64
        ./dist/blackout-core-linux-amd64 -version

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Python tests
      timeout-minutes: 30
      env:
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        # Private temp root for this run, matching the Windows job.
        mkdir -p "$RUNNER_TEMP/pytest-temp"
        export TMPDIR="$RUNNER_TEMP/pytest-temp"
        python -m pytest --rootdir=. tests -p no:cacheprovider \
          --basetemp="$RUNNER_TEMP/pytest-temp/basetemp" \
          --junitxml="$RUNNER_TEMP/pytest-junit.xml"

    - name: Annotate failing Python tests
      if: failure()
      run: python scripts/annotate_pytest_junit.py "$RUNNER_TEMP/pytest-junit.xml"

    - name: Verify wheel installation
      run: |
        python -m pip wheel --no-deps --wheel-dir dist .
        python -m venv /tmp/blackout-wheel-smoke
        /tmp/blackout-wheel-smoke/bin/pip install dist/*.whl
        /tmp/blackout-wheel-smoke/bin/blackout version

    - name: Upload Linux runtime artifact
      uses: actions/upload-artifact@v4
      with:
        name: blackout-linux-engine
        path: dist/blackout-engine-linux-amd64

  linux-distro-smoke:
    name: Linux distro smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian
            image: debian:bookworm-slim
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip python3-venv
          - name: Fedora
            image: fedora:latest
            install: dnf install -y python3 python3-pip
          - name: Arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm python python-pip
    container:
      image: ${{ matrix.image }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install Python
      run: ${{ matrix.install }}

    - name: Install and smoke test package
      run: |
        python3 -m venv /tmp/blackout-venv
        /tmp/blackout-venv/bin/pip install .
        /tmp/blackout-venv/bin/blackout --help
        /tmp/blackout-venv/bin/blackout tools --help

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Download Windows build artifact
      uses: actions/download-artifact@v4
      with:
        name: blackout-windows-exe
        path: dist/

    - name: Download Linux runtime artifact
      uses: actions/download-artifact@v4
      with:
        name: blackout-linux-engine
        path: dist/

    - name: Create source update asset
      shell: bash
      run: |
        git archive --format=zip --prefix=blackout-kit/ -o dist/blackout-source.zip HEAD

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/blackout.exe
          dist/blackout-engine-linux-amd64
          dist/blackout-source.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
