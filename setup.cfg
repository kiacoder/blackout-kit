[flake8]
# Line length: the tree sits at p95=87, p99=114. 110 is the target for code.
# E501 is ignored because the remaining long lines are URLs, table strings and
# single-line payloads where wrapping makes them harder to audit.
# E203/W503/W504: black-style formatting conflicts.
# E402: late imports are deliberate - engines and binaries load lazily.
# E221/E241/E251/E261/E272: the codebase aligns assignments, call keywords and
# trailing comments into columns on purpose (settings tables, engine maps).
# Splitting those apart would make the tables harder to read, not easier.
max-line-length = 110
extend-ignore = E203,W503,W504,E501,E402,E221,E241,E251,E261,E272
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    core/amneziawg-go,
    out,
    blackout_kit.egg-info
per-file-ignores =
    # Tests: long assertion lines are fine, and the remaining F841/E125/E127/
    # E731/F824 sites are mock handles kept for their side effects and
    # backslash-continued with-blocks whose alignment pycodestyle misjudges.
    tests/*:E501,E701,E125,E127,E731,F841,F824
    # help_text.py is one big triple-quoted string table; pycodestyle reads
    # the closing quotes at column 1 as misindented continuations (E122).
    blackoutkit/help_text.py:E12
