[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackout-kit"
version = "1.1.1"
description = "Network security and bypass toolkit for Windows and Linux"
readme = "README.md"
authors = [
    { name = "Kiacoder" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.1",
    "httpx[socks,http2]>=0.27.0",
    "psutil>=6.0.0",
    "cryptography>=43.0.0",
    "typer>=0.12.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2.2",
    "Pillow>=10.0.0",
    "pystray>=0.19.3",
]
capture = [
    "scapy>=2.5.0",
]
media = [
    "yt-dlp>=2024.01.01",
]
torrent = [
    "python-libtorrent>=1.2.19; sys_platform == 'linux'",
]
all = [
    "customtkinter>=5.2.2",
    "Pillow>=10.0.0",
    "pystray>=0.19.3",
    "scapy>=2.5.0",
    "yt-dlp>=2024.01.01",
    "python-libtorrent>=1.2.19; sys_platform == 'linux'",
]
# python-libtorrent is distributed for supported Linux environments, not Windows.
# The torrent command reports an actionable installation message when unavailable.
test = [
    "pytest>=8.0.0",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
blackout = "blackoutkit.typer_cli:main"

[tool.setuptools.packages.find]
include = ["blackoutkit*"]

[tool.setuptools.package-data]
blackoutkit = [
    "resources/data/*.txt",
    "resources/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
