[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackout-kit"
version = "1.1.0"
description = "Advanced DPI bypass & censorship circumvention toolkit"
readme = "README.md"
authors = [
    { name = "Kiacoder" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
    "typer>=0.12.0",
]

[project.scripts]
blackout = "blackoutkit.typer_cli:main"

[tool.setuptools]
packages = ["blackoutkit"]
