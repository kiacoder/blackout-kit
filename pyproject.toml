[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackout-kit"
version = "1.1.1"
description = "Advanced DPI bypass & censorship circumvention toolkit"
readme = "README.md"
authors = [
    { name = "Kiacoder" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "cryptography>=43.0.0",
    "typer>=0.12.0",
    "pystray>=0.19.3",
    "Pillow>=10.0.0",
    "customtkinter>=5.2.2",
]

[project.scripts]
blackout = "blackoutkit.typer_cli:main"

[tool.setuptools.packages.find]
include = ["blackoutkit*"]
